name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One authoritative run per branch or pull request. A rebase, a re-push or a
# follow-up commit cancels the superseded run instead of queueing another six
# jobs behind it. Without this a phase can accumulate four competing runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Dependency advisory gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run the dependency and advisory gate
        run: npm run check:dependencies -- --report-dir dependency-reports

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-audit
          path: dependency-reports/
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check:versions
      - run: npm run check:file-budgets
      - run: npm run check:modules
      - run: npm run check:security
      - run: npm run check:docs
      - run: npm run site:build
      - run: npm run site:check
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check:i18n
      - run: npm run check:themes
      - run: npm test -- --run
      - run: npm run test:robustness
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14
      - run: npm run build
      - name: Install Chromium for the browser suites
        timeout-minutes: 18
        run: |
          # `--with-deps` calls apt. On 2026-11-11 the runner could not resolve
          # the Ubuntu mirrors, so the step retried for twelve minutes and
          # failed a phase that had no code problem. Install the shared
          # libraries when apt works, and fall back to the browser alone when it
          # does not: the hosted runner image already carries them, and the
          # suites fail loudly if one is actually missing.
          for attempt in 1 2 3; do
            if timeout 300 npx playwright install --with-deps chromium; then
              exit 0
            fi
            echo "::warning::Playwright install with system packages failed (attempt ${attempt})"
            sleep $((attempt * 10))
          done
          echo "::warning::Falling back to the browser alone; apt appears unreachable on this runner."
          for attempt in 1 2 3; do
            if timeout 240 npx playwright install chromium; then
              exit 0
            fi
            echo "::warning::Browser-only install attempt ${attempt} failed; retrying"
            sleep $((attempt * 10))
          done
          echo "::error::Playwright browser install failed after all attempts."
          exit 1
      - run: npm run test:ui
      - run: npm run test:import
      - run: npm run test:canvas
      - run: npm run test:count
      - run: npm run test:touch
      - run: npm run test:csp
      - run: npm run test:visual
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: visual-regression-failures
          path: visual-regression-failures/
          if-no-files-found: ignore
          retention-days: 14

  rust:
    name: Rust format and check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        timeout-minutes: 12
        run: |
          # A mirror or DNS outage must fail fast and retry, not sit inside
          # apt's own retry loop for twelve minutes. Three attempts, five
          # minutes each. Treat a repeat as an environment finding, not a code
          # failure: see AGENTS.md, "CI and build hosts".
          packages="build-essential curl file libayatana-appindicator3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf wget xvfb"
          for attempt in 1 2 3; do
            if timeout 300 sudo apt-get update \
              && timeout 300 sudo apt-get install -y $packages; then
              exit 0
            fi
            echo "::warning::System package install attempt ${attempt} failed; retrying"
            sleep $((attempt * 15))
          done
          echo "::error::System package install failed after three attempts. This is a runner or mirror problem, not a code failure."
          exit 1

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Check Rust build
        working-directory: src-tauri
        run: cargo check

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --lib

  desktop:
    name: Desktop shell (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        timeout-minutes: 12
        run: |
          packages="build-essential curl file libayatana-appindicator3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf wget xvfb"
          for attempt in 1 2 3; do
            if timeout 300 sudo apt-get update \
              && timeout 300 sudo apt-get install -y $packages; then
              exit 0
            fi
            echo "::warning::System package install attempt ${attempt} failed; retrying"
            sleep $((attempt * 15))
          done
          echo "::error::System package install failed after three attempts. This is a runner or mirror problem, not a code failure."
          exit 1

      - run: npm ci

      # The path guard is Windows- and macOS-relevant: drive-relative
      # spellings, UNC prefixes, a case-insensitive volume, trailing-dot
      # aliases, verbatim prefixes and junctions only exist there. Run the Rust
      # unit tests on every matrix entry so a regression fails before a tag
      # (F-036, #199). The Windows-only cases live in
      # src-tauri/src/path_guard_windows_tests.rs.
      - name: Run Rust unit tests
        working-directory: src-tauri
        shell: bash
        run: cargo test --lib

      - name: Build the desktop shell
        run: npm run tauri build -- --debug --no-bundle

      - name: Smoke test the packaged app (Linux)
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/gridscalr-smoke"
          xvfb-run -a src-tauri/target/debug/gridscalr --smoke-test "$directory"
          cat "$directory/result.json"

      - name: Smoke test the packaged app (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/gridscalr-smoke"
          src-tauri/target/debug/gridscalr --smoke-test "$directory"
          cat "$directory/result.json"

      - name: Smoke test the packaged app (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $directory = Join-Path $env:RUNNER_TEMP "gridscalr-smoke"
          $process = Start-Process -FilePath "src-tauri/target/debug/gridscalr.exe" `
            -ArgumentList "--smoke-test `"$directory`"" -Wait -PassThru
          Get-Content (Join-Path $directory "result.json")
          if ($process.ExitCode -ne 0) {
            throw "Packaged smoke test failed with exit code $($process.ExitCode)"
          }
