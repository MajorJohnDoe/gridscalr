name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependency advisory gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run the dependency and advisory gate
        run: npm run check:dependencies -- --report-dir dependency-reports

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-audit
          path: dependency-reports/
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check:versions
      - run: npm run check:file-budgets
      - run: npm run check:modules
      - run: npm run check:security
      - run: npm run check:docs
      - run: npm run site:build
      - run: npm run site:check
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check:i18n
      - run: npm run check:themes
      - run: npm test -- --run
      - run: npm run test:robustness
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: npm run test:import
      - run: npm run test:canvas
      - run: npm run test:count
      - run: npm run test:touch
      - run: npm run test:csp
      - run: npm run test:visual
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: visual-regression-failures
          path: visual-regression-failures/
          if-no-files-found: ignore
          retention-days: 14

  rust:
    name: Rust format and check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget \
            xvfb

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Check Rust build
        working-directory: src-tauri
        run: cargo check

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --lib

  desktop:
    name: Desktop shell (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget \
            xvfb

      - run: npm ci

      - name: Build the desktop shell
        run: npm run tauri build -- --debug --no-bundle

      - name: Smoke test the packaged app (Linux)
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/gridscalr-smoke"
          xvfb-run -a src-tauri/target/debug/gridscalr --smoke-test "$directory"
          cat "$directory/result.json"

      - name: Smoke test the packaged app (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/gridscalr-smoke"
          src-tauri/target/debug/gridscalr --smoke-test "$directory"
          cat "$directory/result.json"

      - name: Smoke test the packaged app (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $directory = Join-Path $env:RUNNER_TEMP "gridscalr-smoke"
          $process = Start-Process -FilePath "src-tauri/target/debug/gridscalr.exe" `
            -ArgumentList "--smoke-test `"$directory`"" -Wait -PassThru
          Get-Content (Join-Path $directory "result.json")
          if ($process.ExitCode -ne 0) {
            throw "Packaged smoke test failed with exit code $($process.ExitCode)"
          }
