name: Windows build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build Windows executable and installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build Tauri app
        run: npm run tauri build

      - name: Create SHA-256 checksums
        shell: pwsh
        run: |
          $patterns = @(
            "src-tauri/target/release/gridscalr.exe",
            "src-tauri/target/release/bundle/nsis/*.exe",
            "src-tauri/target/release/bundle/msi/*.msi"
          )
          $files = foreach ($pattern in $patterns) {
            Get-ChildItem -Path $pattern -File
          }
          if (-not $files) {
            throw "No release artifacts found for checksums."
          }
          $files | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Path "SHA256SUMS.txt" -Encoding utf8

      - uses: actions/upload-artifact@v7
        with:
          name: gridscalr-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/gridscalr.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            SHA256SUMS.txt
