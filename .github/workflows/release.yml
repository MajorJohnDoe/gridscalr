name: Release build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
            artifact: gridscalr-windows
            target: ""
            bundles: nsis,msi
          - platform: macOS
            os: macos-latest
            artifact: gridscalr-macos
            target: universal-apple-darwin
            bundles: dmg
          - platform: Linux
            os: ubuntu-22.04
            artifact: gridscalr-linux
            target: ""
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Rust with both macOS targets
        if: matrix.platform == 'macOS'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install Rust
        if: matrix.platform != 'macOS'
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libfuse2 \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget \
            xvfb

      - run: npm ci

      - name: Build application and bundles
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BUNDLES: ${{ matrix.bundles }}
        run: |
          args=(--bundles "$BUNDLES")
          if [ -n "$TARGET" ]; then
            args+=(--target "$TARGET")
          fi
          npm run tauri build -- "${args[@]}"

      - name: Stage Windows files and checksums
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          $release = "release"
          New-Item -ItemType Directory -Force -Path $release | Out-Null
          Copy-Item "src-tauri/target/release/gridscalr.exe" $release
          Copy-Item "src-tauri/target/release/bundle/nsis/*.exe" $release
          Copy-Item "src-tauri/target/release/bundle/msi/*.msi" $release
          $files = Get-ChildItem -Path $release -File
          if (-not $files) {
            throw "No release artifacts found for checksums."
          }
          $lines = $files | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $content = ($lines -join "`n") + "`n"
          [System.IO.File]::WriteAllText(
            (Join-Path $release "SHA256SUMS-windows.txt"),
            $content,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Stage macOS files and checksums
        if: matrix.platform == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          target="universal-apple-darwin"
          bundle="src-tauri/target/$target/release/bundle"
          release="release"
          mkdir -p "$release"
          # DMG bundling deletes the intermediate .app, so bundle the app again
          # (the compile is cached) and zip it before copying the disk image.
          npm run tauri build -- --target "$target" --bundles app
          ditto -c -k --keepParent "$bundle/macos/GridScalr.app" \
            "$release/GridScalr_${version}_universal.app.zip"
          cp "$bundle"/dmg/*.dmg "$release"/
          (cd "$release" && shasum -a 256 * > SHA256SUMS-macos.txt)

      - name: Stage Linux files and checksums
        if: matrix.platform == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          release="release"
          mkdir -p "$release"
          cp src-tauri/target/release/bundle/appimage/*.AppImage "$release"/
          cp src-tauri/target/release/bundle/deb/*.deb "$release"/
          tar -czf "$release/gridscalr_${version}_amd64.tar.gz" \
            -C src-tauri/target/release gridscalr
          (cd "$release" && sha256sum * > SHA256SUMS-linux.txt)

      - name: Smoke test the packaged app (Linux)
        if: matrix.platform == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/gridscalr-smoke"
          xvfb-run -a src-tauri/target/release/gridscalr --smoke-test "$directory"
          cat "$directory/result.json"

      - name: Smoke test the packaged app (macOS)
        if: matrix.platform == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/gridscalr-smoke"
          "src-tauri/target/universal-apple-darwin/release/bundle/macos/GridScalr.app/Contents/MacOS/gridscalr" \
            --smoke-test "$directory"
          cat "$directory/result.json"

      - name: Smoke test the packaged app (Windows)
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          $directory = Join-Path $env:RUNNER_TEMP "gridscalr-smoke"
          $process = Start-Process -FilePath "src-tauri/target/release/gridscalr.exe" `
            -ArgumentList "--smoke-test `"$directory`"" -Wait -PassThru
          Get-Content (Join-Path $directory "result.json")
          if ($process.ExitCode -ne 0) {
            throw "Packaged smoke test failed with exit code $($process.ExitCode)"
          }

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: release/*

  checksums:
    name: Combine checksums
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: gridscalr-*
          path: artifacts

      - name: Merge the per-platform checksums into one file
        run: |
          set -euo pipefail
          find artifacts -name "SHA256SUMS-*.txt" -print0             | sort -z             | xargs -0 cat > SHA256SUMS.txt
          test -s SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: gridscalr-checksums
          if-no-files-found: error
          retention-days: 14
          path: SHA256SUMS.txt
