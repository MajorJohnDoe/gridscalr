name: Release build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
            artifact: gridscalr-windows
            target: ""
            bundles: nsis,msi
          - platform: macOS
            os: macos-latest
            artifact: gridscalr-macos
            target: universal-apple-darwin
            bundles: dmg
          - platform: Linux
            os: ubuntu-22.04
            artifact: gridscalr-linux
            target: ""
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Rust with both macOS targets
        if: matrix.platform == 'macOS'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install Rust
        if: matrix.platform != 'macOS'
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libfuse2 \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - run: npm ci

      - name: Build application and bundles
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BUNDLES: ${{ matrix.bundles }}
        run: |
          args=(--bundles "$BUNDLES")
          if [ -n "$TARGET" ]; then
            args+=(--target "$TARGET")
          fi
          npm run tauri build -- "${args[@]}"

      - name: Stage Windows files and checksums
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          $release = "release"
          New-Item -ItemType Directory -Force -Path $release | Out-Null
          Copy-Item "src-tauri/target/release/gridscalr.exe" $release
          Copy-Item "src-tauri/target/release/bundle/nsis/*.exe" $release
          Copy-Item "src-tauri/target/release/bundle/msi/*.msi" $release
          $files = Get-ChildItem -Path $release -File
          if (-not $files) {
            throw "No release artifacts found for checksums."
          }
          $lines = $files | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $content = ($lines -join "`n") + "`n"
          [System.IO.File]::WriteAllText(
            (Join-Path $release "SHA256SUMS-windows.txt"),
            $content,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Stage macOS files and checksums
        if: matrix.platform == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          bundle="src-tauri/target/universal-apple-darwin/release/bundle"
          release="release"
          mkdir -p "$release"
          cp "$bundle"/dmg/*.dmg "$release"/
          # The bundler deletes the .app after creating the DMG, so zip it from
          # the mounted image instead of the intermediate bundle folder.
          mount="$(mktemp -d)"
          dmg="$(find "$release" -maxdepth 1 -name '*.dmg' -print -quit)"
          hdiutil attach "$dmg" -mountpoint "$mount" -nobrowse -quiet
          app="$(find "$mount" -maxdepth 1 -name '*.app' -print -quit)"
          ditto -c -k --keepParent "$app" "$release/GridScalr_${version}_universal.app.zip"
          hdiutil detach "$mount" -quiet
          rmdir "$mount"
          (cd "$release" && shasum -a 256 * > SHA256SUMS-macos.txt)

      - name: Stage Linux files and checksums
        if: matrix.platform == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          release="release"
          mkdir -p "$release"
          cp src-tauri/target/release/bundle/appimage/*.AppImage "$release"/
          cp src-tauri/target/release/bundle/deb/*.deb "$release"/
          tar -czf "$release/gridscalr_${version}_amd64.tar.gz" \
            -C src-tauri/target/release gridscalr
          (cd "$release" && sha256sum * > SHA256SUMS-linux.txt)

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: release/*

  checksums:
    name: Combine checksums
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: gridscalr-*
          path: artifacts

      - name: Merge the per-platform checksums into one file
        run: |
          set -euo pipefail
          find artifacts -name "SHA256SUMS-*.txt" -print0             | sort -z             | xargs -0 cat > SHA256SUMS.txt
          test -s SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: gridscalr-checksums
          if-no-files-found: error
          retention-days: 14
          path: SHA256SUMS.txt
