name: Release build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependency advisory gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit

      - name: Run the dependency and advisory gate
        run: npm run check:dependencies -- --report-dir dependency-reports

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dependency-audit
          path: dependency-reports/
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: Build ${{ matrix.platform }}
    needs: dependencies
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
            artifact: gridscalr-windows
            target: ""
            bundles: nsis,msi
          - platform: macOS
            os: macos-latest
            artifact: gridscalr-macos
            target: universal-apple-darwin
            bundles: dmg
          - platform: Linux
            os: ubuntu-22.04
            artifact: gridscalr-linux
            target: ""
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install Rust with both macOS targets
        if: matrix.platform == 'macOS'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install Rust
        if: matrix.platform != 'macOS'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'Linux'
        timeout-minutes: 12
        run: |
          # Bounded retry: a mirror or DNS outage must not consume the build.
          packages="build-essential curl file libayatana-appindicator3-dev libfuse2 librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf wget xvfb"
          for attempt in 1 2 3; do
            if timeout 300 sudo apt-get update \
              && timeout 300 sudo apt-get install -y $packages; then
              exit 0
            fi
            echo "::warning::System package install attempt ${attempt} failed; retrying"
            sleep $((attempt * 15))
          done
          echo "::error::System package install failed after three attempts. This is a runner or mirror problem, not a code failure."
          exit 1

      - run: npm ci

      # GitHub's release-asset CDN can return 504 for the older bundler tools.
      # Fetch them through the API so a release build does not depend on that
      # download path.
      - name: Cache Tauri Linux bundler tools
        if: matrix.platform == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools="$HOME/.cache/tauri"
          mkdir -p "$tools"
          gh release download apprun-old \
            --repo tauri-apps/binary-releases \
            --pattern AppRun-x86_64 \
            --dir "$tools" \
            --clobber
          chmod +x "$tools/AppRun-x86_64"
          gh release download linuxdeploy-07333c6 \
            --repo tauri-apps/binary-releases \
            --pattern linuxdeploy-x86_64.AppImage \
            --dir "$tools" \
            --clobber
          mv "$tools/linuxdeploy-x86_64.AppImage" \
            "$tools/linuxdeploy-07333c6-x86_64.AppImage"
          chmod +x "$tools/linuxdeploy-07333c6-x86_64.AppImage"
          if gh release download continuous \
            --repo linuxdeploy/linuxdeploy-plugin-appimage \
            --pattern linuxdeploy-plugin-appimage-x86_64.AppImage \
            --dir "$tools" \
            --clobber; then
            cp "$tools/linuxdeploy-plugin-appimage-x86_64.AppImage" \
              "$tools/linuxdeploy-plugin-appimage.AppImage"
            chmod +x "$tools/linuxdeploy-plugin-appimage.AppImage"
          fi

      - name: Cache Tauri Windows bundler tools
        if: matrix.platform == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tools = Join-Path $env:LOCALAPPDATA 'tauri'
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          $tmp = Join-Path $env:RUNNER_TEMP 'tauri-tools'
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null

          gh release download nsis-3.13 `
            --repo tauri-apps/binary-releases `
            --pattern nsis-3.13.zip `
            --dir $tmp `
            --clobber
          Expand-Archive -Path (Join-Path $tmp 'nsis-3.13.zip') -DestinationPath $tmp -Force
          $nsis = Join-Path $tools 'NSIS'
          if (Test-Path $nsis) { Remove-Item -Recurse -Force $nsis }
          Move-Item (Join-Path $tmp 'nsis-3.13') $nsis
          $plugin = Join-Path $nsis 'Plugins\x86-unicode\additional'
          New-Item -ItemType Directory -Force -Path $plugin | Out-Null
          gh release download nsis_tauri_utils-v0.5.3 `
            --repo tauri-apps/nsis-tauri-utils `
            --pattern nsis_tauri_utils.dll `
            --dir $plugin `
            --clobber

          gh release download wix3141rtm `
            --repo wixtoolset/wix3 `
            --pattern wix314-binaries.zip `
            --dir $tmp `
            --clobber
          $wix = Join-Path $tools 'WixTools314'
          if (Test-Path $wix) { Remove-Item -Recurse -Force $wix }
          Expand-Archive -Path (Join-Path $tmp 'wix314-binaries.zip') -DestinationPath $wix -Force

      - name: Build application and bundles
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BUNDLES: ${{ matrix.bundles }}
        run: |
          args=(--bundles "$BUNDLES")
          if [ -n "$TARGET" ]; then
            args+=(--target "$TARGET")
          fi
          npm run tauri build -- "${args[@]}"

      - name: Stage Windows files and checksums
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          $release = "release"
          New-Item -ItemType Directory -Force -Path $release | Out-Null
          Copy-Item "src-tauri/target/release/gridscalr.exe" $release
          Copy-Item "src-tauri/target/release/bundle/nsis/*.exe" $release
          Copy-Item "src-tauri/target/release/bundle/msi/*.msi" $release
          $files = Get-ChildItem -Path $release -File
          if (-not $files) {
            throw "No release artifacts found for checksums."
          }
          $lines = $files | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $content = ($lines -join "`n") + "`n"
          [System.IO.File]::WriteAllText(
            (Join-Path $release "SHA256SUMS-windows.txt"),
            $content,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Stage macOS files and checksums
        if: matrix.platform == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          target="universal-apple-darwin"
          bundle="src-tauri/target/$target/release/bundle"
          release="release"
          mkdir -p "$release"
          # DMG bundling deletes the intermediate .app, so bundle the app again
          # (the compile is cached) and zip it before copying the disk image.
          npm run tauri build -- --target "$target" --bundles app
          ditto -c -k --keepParent "$bundle/macos/GridScalr.app" \
            "$release/GridScalr_${version}_universal.app.zip"
          cp "$bundle"/dmg/*.dmg "$release"/
          (cd "$release" && shasum -a 256 * > SHA256SUMS-macos.txt)

      - name: Stage Linux files and checksums
        if: matrix.platform == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          release="release"
          mkdir -p "$release"
          cp src-tauri/target/release/bundle/appimage/*.AppImage "$release"/
          cp src-tauri/target/release/bundle/deb/*.deb "$release"/
          tar -czf "$release/gridscalr_${version}_amd64.tar.gz" \
            -C src-tauri/target/release gridscalr
          (cd "$release" && sha256sum * > SHA256SUMS-linux.txt)

      # The packaged smoke test runs in ci.yml against a **debug** build. The
      # smoke commands are compiled only under `debug_assertions` (F-037), so a
      # release binary ignores `--smoke-test` and opens a window that never
      # closes: on 2026-11-11 that hung all three platforms for two hours during
      # the 0.24.0 release. Release verification therefore checks the staged
      # artifacts and checksums that the staging steps above produced.
      - name: Verify the staged release artifacts (Linux and macOS)
        if: matrix.platform != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          suffix="$(echo "${{ matrix.platform }}" | tr '[:upper:]' '[:lower:]')"
          sums="release/SHA256SUMS-${suffix}.txt"
          test -s "$sums" || { echo "::error::Missing $sums"; exit 1; }
          artifacts=$(find release -maxdepth 1 -type f ! -name 'SHA256SUMS*' | wc -l)
          echo "Staged ${artifacts} artifacts for ${{ matrix.platform }}"
          test "$artifacts" -ge 2 || { echo "::error::Expected at least two artifacts"; exit 1; }
          cat "$sums"

      - name: Verify the staged release artifacts (Windows)
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          $sums = "release/SHA256SUMS-windows.txt"
          if (-not (Test-Path $sums)) { throw "Missing $sums" }
          $artifacts = Get-ChildItem "release" -File | Where-Object { $_.Name -notlike "SHA256SUMS*" }
          if ($artifacts.Count -lt 2) { throw "Expected at least two artifacts" }
          foreach ($file in $artifacts) {
            if ($file.Length -le 0) { throw "Empty artifact $($file.Name)" }
          }
          Write-Host "Staged $($artifacts.Count) artifacts for Windows"
          Get-Content $sums

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: release/*

  checksums:
    name: Combine checksums
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: gridscalr-*
          path: artifacts

      - name: Merge the per-platform checksums into one file
        run: |
          set -euo pipefail
          find artifacts -name "SHA256SUMS-*.txt" -print0             | sort -z             | xargs -0 cat > SHA256SUMS.txt
          test -s SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gridscalr-checksums
          if-no-files-found: error
          retention-days: 14
          path: SHA256SUMS.txt
