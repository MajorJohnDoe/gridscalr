<!doctype html>
<html lang="en" data-theme="medium-grey">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      No Content-Security-Policy meta tag here. The desktop shell adds the single
      authoritative production policy as a response header from
      src-tauri/tauri.conf.json. The Vite dev server injects the development
      policy for the browser fallback; see security/policy.json and
      docs/security-policy.md.
    -->
    <title>GridScalr</title>
    <link rel="stylesheet" href="/boot.css" />
    <script src="./boot-theme.js"></script>
    <script type="module" src="/boot-error.js"></script>
  </head>
  <body>
    <div id="app">
      <div class="boot-fallback" data-boot-fallback>
        <div class="boot-card">
          <div class="boot-brand">Grid<span>Scalr</span></div>
          <p class="boot-status" data-boot-status>Starting…</p>
          <p class="boot-hint">
            If this message stays visible, the interface failed to load. Restart the app and make
            sure Microsoft Edge WebView2 is up to date.
          </p>
          <pre class="boot-error" data-boot-error hidden></pre>
        </div>
      </div>
    </div>
    <input id="browser-file-input" type="file" hidden />
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
