<!doctype html>
<html lang="en" data-theme="medium-grey">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self'; worker-src 'self' blob:; connect-src 'self' ipc: http://ipc.localhost ws://localhost:1420 http://localhost:1420"
    />
    <title>GridScalr</title>
    <script src="./boot-theme.js"></script>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--boot-bg, #303234);
        color: var(--boot-text, #e3e6e8);
        font-family: Inter, "Segoe UI", system-ui, sans-serif;
      }

      #app {
        min-height: 100vh;
      }

      .boot-fallback {
        box-sizing: border-box;
        display: grid;
        min-height: 100vh;
        padding: 24px;
        place-items: center;
      }

      .boot-card {
        box-sizing: border-box;
        width: min(680px, 100%);
        padding: 28px 32px;
        border: 1px solid var(--boot-border, #4f5459);
        border-radius: 10px;
        background: var(--boot-panel, #36393b);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
      }

      .boot-brand {
        color: var(--boot-text, #f6f8f9);
        font-size: 22px;
        font-weight: 650;
      }

      .boot-brand span {
        color: var(--boot-brand, #4fc7a9);
      }

      .boot-status {
        margin: 14px 0 6px;
        font-size: 14px;
        font-weight: 600;
      }

      .boot-hint {
        margin: 0;
        color: var(--boot-muted, #adb5bb);
        font-size: 13px;
        line-height: 1.55;
      }

      .boot-error {
        max-height: 280px;
        overflow: auto;
        margin: 18px 0 0;
        padding: 12px;
        border: 1px solid var(--boot-error-border, #6b4444);
        border-radius: 6px;
        background: var(--boot-error-bg, #3a2626);
        color: var(--boot-error-text, #ffc4c4);
        font-size: 12px;
        line-height: 1.45;
        white-space: pre-wrap;
        user-select: text;
      }
    </style>
    <script type="module" src="/boot-error.js"></script>
  </head>
  <body>
    <div id="app">
      <div class="boot-fallback" data-boot-fallback>
        <div class="boot-card">
          <div class="boot-brand">Grid<span>Scalr</span></div>
          <p class="boot-status" data-boot-status>Starting…</p>
          <p class="boot-hint">
            If this message stays visible, the interface failed to load. Restart the app and make
            sure Microsoft Edge WebView2 is up to date.
          </p>
          <pre class="boot-error" data-boot-error hidden></pre>
        </div>
      </div>
    </div>
    <input id="browser-file-input" type="file" hidden />
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
