[package]
name = "gridscalr"
version = "0.9.0"
description = "Local-first PDF plan viewer with calibration, measurement and layered markup tools"
authors = ["MajorJohnDoe"]
license = "MIT"
repository = "https://github.com/MajorJohnDoe/gridscalr"
homepage = "https://github.com/MajorJohnDoe/gridscalr#readme"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "gridscalr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
