[package]
name = "gridscalr"
version = "0.3.0"
description = "Local-first PDF plan viewer with calibration, measurement and layered markup tools"
authors = ["GridScalr"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "gridscalr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
